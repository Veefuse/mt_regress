
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mt_regress"
version = "1.0.1"
description = "a regress test tool"
requires-python = ">=3.8"
dependencies = [
  "PyYAML"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License"
]

[project.scripts]
mt_regress = "mt_regress.mt_regress:main"